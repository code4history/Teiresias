name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

# Least privilege by default; only the deploy job gets the Pages token scopes.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo site
    runs-on: ubuntu-latest
    steps:
      # @c4h/daedalus and @c4h/atlas resolve to the sibling checkouts (link: overrides in
      # ci/pnpm-workspace.ci.yaml), so this repository goes into a subdirectory of
      # $GITHUB_WORKSPACE and the siblings are placed next to it. All three repositories are
      # public, so the default GITHUB_TOKEN can check them out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Teiresias
          persist-credentials: false
      # Sibling ref: same name, then base ref, then the latest train/* branch, then master.
      - name: Select sibling refs
        id: sibling
        run: node Teiresias/scripts/select-sibling-ref.mjs code4history/Daedalus code4history/Atlas
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: code4history/Daedalus
          ref: ${{ steps.sibling.outputs.daedalus }}
          path: Daedalus
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: code4history/Atlas
          ref: ${{ steps.sibling.outputs.atlas }}
          path: Atlas
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.27.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          # No lockfile sits directly under $GITHUB_WORKSPACE in this layout, so name all three.
          cache-dependency-path: |
            Teiresias/pnpm-lock.yaml
            Atlas/pnpm-lock.yaml
            Daedalus/pnpm-lock.yaml

      # exports point at dist, so the siblings are built before this package.
      - name: Build Daedalus
        working-directory: Daedalus
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml && pnpm install --frozen-lockfile && pnpm run build
      - name: Build Atlas
        working-directory: Atlas
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml && pnpm install --frozen-lockfile && pnpm run build

      - name: Use CI pnpm settings
        working-directory: Teiresias
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml
      - name: Install dependencies
        working-directory: Teiresias
        run: pnpm install --frozen-lockfile
      - name: Build and verify demo site
        working-directory: Teiresias
        run: pnpm run verify:demo
      - name: Verify browser bundle
        working-directory: Teiresias
        run: pnpm run verify:demo-bundle

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./Teiresias/dist-demo

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
